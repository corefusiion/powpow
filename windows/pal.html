<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Powpow Pal</title>
  </head>
  <body>
    <div id="pal-root">
      <!-- Thought bubble popup for sarcastic thoughts -->
      <div id="pal-thought" class="pal-thought" hidden>
        <div id="pal-thought-content"></div>
        <div class="pal-thought-bubble-dot dot-1"></div>
        <div class="pal-thought-bubble-dot dot-2"></div>
      </div>

      <!-- Visual alert aura & sparkle rings for lively notifications (no audio) -->
      <div id="pal-alert-aura" class="pal-alert-aura" hidden>
        <div class="pal-aura-pulse"></div>
        <div class="pal-sparkle s-1">✨</div>
        <div class="pal-sparkle s-2">⭐</div>
        <div class="pal-sparkle s-3">✨</div>
      </div>

      <!-- Informative Notification Popup for Emails, WhatsApp & Calendar -->
      <div id="pal-alert-popup" class="pal-alert-popup" hidden>
        <div class="pal-alert-header">
          <span id="pal-alert-badge" class="pal-alert-badge theme-email">
            <span id="pal-alert-icon" class="pal-alert-icon">✉️</span>
            <span id="pal-alert-type" class="pal-alert-type">Novo E-mail</span>
          </span>
          <div class="pal-alert-actions">
            <button id="pal-alert-reply-btn" class="pal-alert-reply-btn" type="button" hidden>↩ Responder</button>
            <button id="pal-alert-close" class="pal-alert-close" type="button" aria-label="Fechar">✕</button>
          </div>
        </div>
        <div class="pal-alert-body">
          <div id="pal-alert-sender" class="pal-alert-sender"></div>
          <div id="pal-alert-subject" class="pal-alert-subject"></div>
          <div id="pal-alert-snippet" class="pal-alert-snippet"></div>
        </div>

        <!-- Inline Reply Box for Quick Email Responses -->
        <div id="pal-alert-reply-box" class="pal-alert-reply-box" hidden>
          <div id="pal-alert-reply-to" class="pal-alert-reply-to"></div>
          <textarea id="pal-alert-reply-input" class="pal-alert-reply-input" placeholder="Digite sua resposta..." rows="2"></textarea>
          <div class="pal-alert-reply-actions">
            <button id="pal-alert-reply-cancel" class="pal-alert-reply-cancel" type="button">Cancelar</button>
            <button id="pal-alert-reply-send" class="pal-alert-reply-send" type="button">Enviar ✈️</button>
          </div>
          <div id="pal-alert-reply-status" class="pal-alert-reply-status" hidden></div>
        </div>

        <div class="pal-alert-progress-bar">
          <div id="pal-alert-progress-fill" class="pal-alert-progress-fill"></div>
        </div>
      </div>

      <!-- On-Desktop Screen Analysis & Chat Popup Beside the Avatar -->
      <div id="pal-chat-popup" class="pal-chat-popup" hidden>
        <div class="pal-chat-header">
          <div class="pal-chat-header-info">
            <div class="pal-chat-title">
              <span class="pal-chat-sparkle">✨</span>
              <span class="pal-chat-title-text">Chat da Tela</span>
            </div>
            <div id="pal-chat-badge" class="pal-chat-badge" title="Janela analisada">
              <span id="pal-chat-app-icon" class="pal-chat-app-icon">🖥️</span>
              <span id="pal-chat-app-name" class="pal-chat-app-name">Tela Ativa</span>
            </div>
          </div>
          <div class="pal-chat-header-actions">
            <button id="pal-chat-select-area-btn" class="pal-chat-btn-icon pal-chat-btn-selector" type="button" title="Selecionar área da tela (Seletor de trecho/fórmula)">🎯</button>
            <button id="pal-chat-recapture-btn" class="pal-chat-btn-icon" type="button" title="Recapturar tela atual">📸</button>
            <button id="pal-chat-clear-btn" class="pal-chat-btn-icon" type="button" title="Limpar conversa">🔄</button>
            <button id="pal-chat-close-btn" class="pal-chat-close-btn" type="button" aria-label="Fechar">✕</button>
          </div>
        </div>
        <div id="pal-chat-target-title" class="pal-chat-target-title"></div>

        <!-- Captured Image Thumbnail Preview & Status Bar -->
        <div id="pal-chat-preview-card" class="pal-chat-preview-card" hidden>
          <div class="pal-chat-thumb-wrap" id="pal-chat-thumb-wrap" title="Clique para ampliar imagem capturada">
            <img id="pal-chat-thumb-img" class="pal-chat-thumb-img" src="" alt="Captura da tela" />
            <span class="pal-chat-thumb-zoom-icon">🔍</span>
          </div>
          <div class="pal-chat-thumb-meta">
            <div id="pal-chat-thumb-title" class="pal-chat-thumb-title">📸 Imagem capturada</div>
            <div id="pal-chat-thumb-sub" class="pal-chat-thumb-sub">Pronta para análise e fórmulas</div>
          </div>
          <button id="pal-chat-thumb-retake-btn" class="pal-chat-thumb-retake-btn" type="button" title="Tirar nova foto">Recapturar</button>
        </div>

        <!-- Image Lightbox Modal to inspect the exact capture -->
        <div id="pal-chat-lightbox" class="pal-chat-lightbox" hidden>
          <div class="pal-chat-lightbox-content">
            <img id="pal-chat-lightbox-img" src="" alt="Visualização Completa" />
            <button id="pal-chat-lightbox-close" class="pal-chat-lightbox-close" type="button">✕ Fechar</button>
          </div>
        </div>

        <!-- Chat messages history -->
        <div id="pal-chat-messages" class="pal-chat-messages"></div>

        <!-- Chat input & quick prompt tags -->
        <div class="pal-chat-input-container">
          <div class="pal-chat-quick-tags" id="pal-chat-quick-tags">
            <button class="pal-chat-tag" type="button" data-tag="Como resolver ou aplicar esta fórmula de forma correta?">📐 Explicar fórmula</button>
            <button class="pal-chat-tag" type="button" data-tag="Faça um resumo claro e objetivo do que está nesta tela.">📋 Resumo da tela</button>
            <button class="pal-chat-tag" type="button" data-tag="O que significa este erro ou mensagem na tela e como resolver?">⚠️ Explicar erro</button>
            <button class="pal-chat-tag" type="button" data-tag="Quais sugestões ou melhorias você tem para o que está nesta tela?">💡 Sugestões</button>
          </div>
          <div class="pal-chat-input-bar">
            <textarea id="pal-chat-input" class="pal-chat-input" placeholder="Tire sua dúvida sobre a tela (Enter envia)..." rows="1"></textarea>
            <button id="pal-chat-send-btn" class="pal-chat-send-btn" type="button" aria-label="Enviar">
              <span class="pal-chat-send-icon">➤</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Interactive Screen Region Selector Overlay -->
      <div id="pal-selector-overlay" class="pal-selector-overlay" hidden>
        <div class="pal-selector-instructions">
          <span class="pal-selector-icon">🎯</span>
          <span>Clique e arraste com o mouse para selecionar o trecho ou fórmula desejada • Pressione <b>Esc</b> para cancelar</span>
        </div>
        <div id="pal-selector-box" class="pal-selector-box" hidden>
          <span id="pal-selector-size-badge" class="pal-selector-size-badge">0 × 0</span>
        </div>
      </div>

      <!-- Close button bite toy -->
      <div id="pal-close-bite" class="pal-close-bite" hidden>
        <div class="pal-close-icon">✕</div>
        <div class="pal-chomp-tag">NHAC! 😋</div>
      </div>

      <!-- Mud and water splatters container -->
      <div id="pal-splatters"></div>

      <!-- The card: clicked off the character, its meaning belongs to the island -->
      <div id="pal-card" hidden>
        <button class="pal-item" data-action="analyze" data-label="Screen analysis"></button>
        <button class="pal-item" data-action="search-open" data-label="Web search"></button>
        <div id="pal-search" hidden>
          <input id="pal-search-input" type="text" />
          <button id="pal-search-go" data-action="search-send" aria-label="Search">→</button>
        </div>
        <div class="pal-sep"></div>
        <button class="pal-item" data-action="organize-desktop" data-label="Organize desktop">🗂️ Organizar Desktop</button>
        <button class="pal-item" data-action="create-doc" data-label="Create document">📄 Criar Documento</button>
        <button class="pal-item" data-action="find-files" data-label="Find files">🔎 Localizar Arquivos</button>
        <button class="pal-item" data-action="ghostwriter" data-label="Ghostwriter">✍️ Escrever no App Ativo</button>
        <div class="pal-sep"></div>
        <button class="pal-item" data-action="pause" data-label="Pause stroll"></button>
        <button class="pal-item" data-action="new-chat" data-label="New chat"></button>
        <button class="pal-item" data-action="settings" data-label="Settings"></button>
        <button class="pal-item" data-action="home" data-label="Back to the island"></button>
      </div>
    </div>
    <script type="module" src="/src/pal.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Powpow Pal</title>
  </head>
  <body>
    <div id="pal-root">
      <!-- Thought bubble popup for sarcastic thoughts -->
      <div id="pal-thought" class="pal-thought" hidden>
        <div id="pal-thought-content"></div>
        <div class="pal-thought-bubble-dot dot-1"></div>
        <div class="pal-thought-bubble-dot dot-2"></div>
      </div>

      <!-- Visual alert aura & sparkle rings for lively notifications (no audio) -->
      <div id="pal-alert-aura" class="pal-alert-aura" hidden>
        <div class="pal-aura-pulse"></div>
        <div class="pal-sparkle s-1">✨</div>
        <div class="pal-sparkle s-2">⭐</div>
        <div class="pal-sparkle s-3">✨</div>
      </div>

      <!-- Informative Notification Popup for Emails, WhatsApp & Calendar -->
      <div id="pal-alert-popup" class="pal-alert-popup" hidden>
        <div class="pal-alert-header">
          <span id="pal-alert-badge" class="pal-alert-badge theme-email">
            <span id="pal-alert-icon" class="pal-alert-icon">✉️</span>
            <span id="pal-alert-type" class="pal-alert-type">Novo E-mail</span>
          </span>
          <button id="pal-alert-close" class="pal-alert-close" type="button" aria-label="Fechar">✕</button>
        </div>
        <div class="pal-alert-body">
          <div id="pal-alert-sender" class="pal-alert-sender"></div>
          <div id="pal-alert-subject" class="pal-alert-subject"></div>
          <div id="pal-alert-snippet" class="pal-alert-snippet"></div>
        </div>
        <div class="pal-alert-progress-bar">
          <div id="pal-alert-progress-fill" class="pal-alert-progress-fill"></div>
        </div>
      </div>

      <!-- Close button bite toy -->
      <div id="pal-close-bite" class="pal-close-bite" hidden>
        <div class="pal-close-icon">✕</div>
        <div class="pal-chomp-tag">NHAC! 😋</div>
      </div>

      <!-- Mud and water splatters container -->
      <div id="pal-splatters"></div>

      <!-- The card: clicked off the character, its meaning belongs to the island -->
      <div id="pal-card" hidden>
        <button class="pal-item" data-action="analyze" data-label="Screen analysis"></button>
        <button class="pal-item" data-action="search-open" data-label="Web search"></button>
        <div id="pal-search" hidden>
          <input id="pal-search-input" type="text" />
          <button id="pal-search-go" data-action="search-send" aria-label="Search">→</button>
        </div>
        <div class="pal-sep"></div>
        <button class="pal-item" data-action="organize-desktop" data-label="Organize desktop">🗂️ Organizar Desktop</button>
        <button class="pal-item" data-action="create-doc" data-label="Create document">📄 Criar Documento</button>
        <button class="pal-item" data-action="find-files" data-label="Find files">🔎 Localizar Arquivos</button>
        <button class="pal-item" data-action="ghostwriter" data-label="Ghostwriter">✍️ Escrever no App Ativo</button>
        <div class="pal-sep"></div>
        <button class="pal-item" data-action="pause" data-label="Pause stroll"></button>
        <button class="pal-item" data-action="new-chat" data-label="New chat"></button>
        <button class="pal-item" data-action="settings" data-label="Settings"></button>
        <button class="pal-item" data-action="home" data-label="Back to the island"></button>
      </div>
    </div>
    <script type="module" src="/src/pal.ts"></script>
  </body>
</html>
